apiVersion: v1
kind: Namespace
metadata:
  name: opencloudos-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: opencloudos-profile-controller
  namespace: opencloudos-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: opencloudos-runtime
  namespace: opencloudos-system
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: opencloudos-profile-controller
  namespace: opencloudos-system
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "create", "update", "delete"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "create", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: opencloudos-profile-controller
  namespace: opencloudos-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: opencloudos-profile-controller
subjects:
  - kind: ServiceAccount
    name: opencloudos-profile-controller
    namespace: opencloudos-system
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: efs-opencloudos
provisioner: efs.csi.aws.com
parameters:
  provisioningMode: efs-ap
  fileSystemId: REPLACE_EFS_FILE_SYSTEM_ID
  basePath: /opencloudos-capsules
  directoryPerms: "700"
  ensureUniqueDirectory: "true"
  reuseAccessPoint: "false"
mountOptions:
  - tls
reclaimPolicy: Delete
volumeBindingMode: Immediate
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: opencloudos-default-deny
  namespace: opencloudos-system
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
